name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (build + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Version comes from package.json "packageManager"; passing it twice fails the action.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dtc/backend run build
      - run: pnpm --filter @dtc/backend run test:unit

  storefront:
    name: storefront (typecheck + build)
    runs-on: ubuntu-latest
    env:
      # Build-time only; the storefront refuses to build without a publishable key.
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_ci_build_only
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
      NEXT_PUBLIC_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_DEFAULT_REGION: us
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dtc/storefront run typecheck
      - run: pnpm --filter @dtc/storefront run build

  python:
    name: agent + service suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: agents (stdlib unittest)
        working-directory: agents/langgraph-agents
        run: python -m unittest discover -s tests
      - name: langgraph service (pinned requirements)
        working-directory: services/langgraph-agent-service
        run: |
          python -m pip install -q -r requirements.txt
          python -m pytest tests -q
