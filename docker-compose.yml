# 3rd Eye Supply — Medusa v2 stack (Hostinger Docker Manager project: medusa-3es)
# Isolated project / network / volumes. Medusa listens on 127.0.0.1:9000 (internal only).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: medusa-3es
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - medusa-3es
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d medusa-3es"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    networks:
      - medusa-3es
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  medusa:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://medusa:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/medusa-3es
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET is required}
      STORE_CORS: ${STORE_CORS:-*}
      ADMIN_CORS: ${ADMIN_CORS:-*}
      AUTH_CORS: ${AUTH_CORS:-*}
      NODE_ENV: production
    ports:
      - "127.0.0.1:9000:9000"
    networks:
      - medusa-3es
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:

networks:
  medusa-3es:
    driver: bridge
