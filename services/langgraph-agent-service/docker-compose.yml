# Local-dev snippet ONLY. No live service is required for the test suite.
# Start Postgres for local development with: docker compose up -d db
# The app service is optional local wiring; the skeleton's tests never use it.
# LOCAL-DEV ONLY (B1-6): the host port mapping below ("5432:5432") and the
# placeholder credentials must NOT be carried to a real deploy. Production
# Postgres stays on the private network with no host port mapping and real
# credentials from env. The Dockerfile also runs as root: local-dev only.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: dev-only-placeholder
      POSTGRES_DB: agentdb
    ports:
      - "5432:5432"
    volumes:
      - agent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agentdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://agent:dev-only-placeholder@db:5432/agentdb
      AGENT_SHARED_SECRET: dev-only-placeholder
      DB_POOL_MIN_SIZE: "1"
      DB_POOL_MAX_SIZE: "10"
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy

volumes:
  agent_pgdata:
